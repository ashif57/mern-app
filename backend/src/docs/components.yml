components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        isEmailVerified:
          type: boolean
      example:
        id: 5ebac534954b54139806c112
        name: Fake Name
        email: fake@example.com
        role: user
        isEmailVerified: false
    Office:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        manager:
          type: string
          description: Manager ID
      example:
        id: 5ebac534954b54139806c112
        name: HQ
        address: 123 Main St
        manager: 5ebac534954b54139806c112
    Auth:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          type: object
          properties:
            access:
              type: object
              properties:
                token:
                  type: string
                expires:
                  type: string
                  format: date-time
            refresh:
              type: object
              properties:
                token:
                  type: string
                expires:
                  type: string
                  format: date-time
      example:
        user:
          id: 5ebac534954b54139806c112
          name: Fake Name
          email: fake@example.com
          role: user
          isEmailVerified: false
        tokens:
          access:
            token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            expires: 2020-05-05T14:48:00.000Z
          refresh:
            token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            expires: 2020-05-05T14:48:00.000Z
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
